<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-label="P-M2-M3 column hinge concept diagram">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .label { font: 700 24px Arial, sans-serif; fill: #111827; }
      .small { font: 400 18px Arial, sans-serif; fill: #475569; }
      .note { font: 400 17px Arial, sans-serif; fill: #334155; }
      .column { fill: #e5e7eb; stroke: #111827; stroke-width: 4; }
      .face { fill: #cbd5e1; stroke: #111827; stroke-width: 3; }
      .axis1 { stroke: #111827; stroke-width: 5; marker-end: url(#arrow); }
      .axis2 { stroke: #2563eb; stroke-width: 5; marker-end: url(#arrowBlue); }
      .axis3 { stroke: #dc2626; stroke-width: 5; marker-end: url(#arrowRed); }
      .m2 { fill: none; stroke: #2563eb; stroke-width: 6; stroke-linecap: round; marker-end: url(#arrowBlue); }
      .m3 { fill: none; stroke: #dc2626; stroke-width: 6; stroke-linecap: round; marker-end: url(#arrowRed); }
      .p { stroke: #15803d; stroke-width: 7; marker-end: url(#arrowGreen); }
      .hinge { fill: #f59e0b; stroke: #111827; stroke-width: 3; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <text x="42" y="58" class="title">P-M2-M3 Etkileşimli Kolon Mafsal Kavramı</text>
  <text x="42" y="92" class="small">P: eksenel kuvvet, M2 ve M3: elemanın yerel 2 ve 3 eksenleri etrafındaki eğilme momentleri</text>

  <!-- Isometric column -->
  <polygon points="410,145 535,190 535,470 410,425" class="column"/>
  <polygon points="290,190 410,145 410,425 290,470" class="face"/>
  <polygon points="290,190 410,145 535,190 415,235" class="face"/>
  <polygon points="290,470 410,425 535,470 415,515" fill="#94a3b8" stroke="#111827" stroke-width="3"/>

  <!-- Plastic hinge zones -->
  <ellipse cx="413" cy="237" rx="53" ry="20" class="hinge"/>
  <ellipse cx="415" cy="510" rx="55" ry="20" class="hinge"/>
  <text x="458" y="250" class="small">mafsal ucu</text>
  <text x="456" y="523" class="small">mafsal ucu</text>

  <!-- Local axes -->
  <line x1="415" y1="330" x2="415" y2="112" class="axis1"/>
  <text x="430" y="132" class="label">local 1</text>
  <text x="448" y="160" class="small">eleman ekseni</text>

  <line x1="415" y1="330" x2="242" y2="395" class="axis2"/>
  <text x="184" y="415" class="label" fill="#2563eb">local 2</text>

  <line x1="415" y1="330" x2="625" y2="390" class="axis3"/>
  <text x="637" y="405" class="label" fill="#dc2626">local 3</text>

  <!-- Axial force P -->
  <line x1="415" y1="102" x2="415" y2="170" class="p"/>
  <text x="348" y="104" class="label" fill="#15803d">P</text>
  <text x="280" y="130" class="small">eksenel kuvvet</text>

  <!-- Moments -->
  <path d="M610,245 C690,215 715,285 660,330" class="m2"/>
  <text x="708" y="278" class="label" fill="#2563eb">M2</text>
  <text x="708" y="306" class="small">local 2 etrafında eğilme</text>

  <path d="M252,250 C170,220 145,294 202,338" class="m3"/>
  <text x="96" y="281" class="label" fill="#dc2626">M3</text>
  <text x="70" y="309" class="small">local 3 etrafında eğilme</text>

  <!-- Interaction statement -->
  <rect x="585" y="432" width="330" height="128" class="box"/>
  <text x="610" y="468" class="label">Etkileşim mantığı</text>
  <text x="610" y="500" class="note">Kolon kapasitesi tek başına M2 veya M3</text>
  <text x="610" y="525" class="note">ile değil; P, M2 ve M3 taleplerinin</text>
  <text x="610" y="550" class="note">birlikte etkisiyle değerlendirilir.</text>

  <rect x="58" y="456" width="245" height="104" class="box"/>
  <text x="80" y="490" class="label">Not</text>
  <text x="80" y="522" class="note">M2/M3 global X-Y yönleri değildir;</text>
  <text x="80" y="547" class="note">yerel eksen tanımına bağlıdır.</text>
</svg>
