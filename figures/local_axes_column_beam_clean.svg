<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Column and beam local axes">
  <defs>
    <marker id="axisArrowBlack" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5.5 L1,10 Z" fill="#111827"/>
    </marker>
    <marker id="axisArrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5.5 L1,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="axisArrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5.5 L1,10 Z" fill="#dc2626"/>
    </marker>
    <style>
      .member { fill: #dbe3ea; stroke: #0f172a; stroke-width: 4; }
      .face { fill: #b8c4d1; stroke: #0f172a; stroke-width: 3; }
      .axis1 { stroke: #111827; stroke-width: 5; marker-end: url(#axisArrowBlack); stroke-linecap: round; }
      .axis2 { stroke: #2563eb; stroke-width: 5; marker-end: url(#axisArrowBlue); stroke-linecap: round; }
      .axis3 { stroke: #dc2626; stroke-width: 5; marker-end: url(#axisArrowRed); stroke-linecap: round; }
      .num1 { font: 700 26px Arial, sans-serif; fill: #111827; }
      .num2 { font: 700 26px Arial, sans-serif; fill: #2563eb; }
      .num3 { font: 700 26px Arial, sans-serif; fill: #dc2626; }
    </style>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>

  <!-- Column member -->
  <g transform="translate(82,22)">
    <polygon points="220,80 340,125 340,425 220,380" class="member"/>
    <polygon points="110,125 220,80 220,380 110,425" class="face"/>
    <polygon points="110,125 220,80 340,125 230,170" class="face"/>
    <polygon points="110,425 220,380 340,425 230,470" fill="#93a4b7" stroke="#0f172a" stroke-width="3"/>

    <line x1="225" y1="290" x2="225" y2="40" class="axis1"/>
    <line x1="225" y1="290" x2="72" y2="360" class="axis2"/>
    <line x1="225" y1="290" x2="410" y2="345" class="axis3"/>
    <text x="236" y="52" class="num1">1</text>
    <text x="46" y="373" class="num2">2</text>
    <text x="420" y="358" class="num3">3</text>
  </g>

  <!-- Beam member -->
  <g transform="translate(495,80)">
    <polygon points="80,235 445,235 510,275 145,275" class="member"/>
    <polygon points="145,275 510,275 510,360 145,360" class="member"/>
    <polygon points="80,235 145,275 145,360 80,320" class="face"/>
    <polygon points="445,235 510,275 510,360 445,320" class="face"/>

    <line x1="275" y1="298" x2="515" y2="298" class="axis1"/>
    <line x1="275" y1="298" x2="178" y2="386" class="axis2"/>
    <line x1="275" y1="298" x2="275" y2="126" class="axis3"/>
    <text x="526" y="306" class="num1">1</text>
    <text x="151" y="404" class="num2">2</text>
    <text x="284" y="130" class="num3">3</text>
  </g>
</svg>
